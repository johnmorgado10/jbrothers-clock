<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shop Clock">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<link rel="icon" type="image/png" href="/img/icon-192.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Shop Clock · J-Brothers Landscaping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/brand.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  * { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; }

  /* Thick green / brown edge bars, as on the style guide's pages. */
  body::before, body::after { content: ""; position: fixed; top: 0; bottom: 0; width: 8px; z-index: 5; }
  body::before { left: 0; background: var(--jb-green); }
  body::after { right: 0; background: var(--jb-brown); }

  header { background: #fff; border-bottom: 3px solid var(--jb-rule); padding: 18px 24px 14px; text-align: center; }
  header img { width: 150px; height: auto; display: block; margin: 0 auto; }
  header .logo-fallback { font-size: 34px; }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px 28px 28px; }
  .screen { display: none; width: 100%; max-width: 460px; text-align: center; }
  .screen.on { display: block; animation: fade .24s var(--ease); }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .tagline { margin-bottom: 14px; }
  .clock { font-size: 104px; line-height: 1; color: var(--jb-brown); font-variant-numeric: tabular-nums; }
  .clock .ampm { font-size: 34px; margin-left: 8px; color: var(--jb-brown); letter-spacing: .06em; }
  .date { margin: 12px 0 26px; }

  .pin-card { padding: 26px 24px 22px; }
  .prompt { font-size: 30px; line-height: 1.1; color: var(--jb-brown); margin: 0; }
  .prompt-es { font-size: 20px; color: #9a8b6b; margin: 2px 0 0; }
  .pin-dots { display: flex; gap: 16px; justify-content: center; margin: 20px 0 22px; }
  .pin-dots div { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--jb-green); transition: background-color .12s var(--ease); }
  .pin-dots div.full { background: var(--jb-green); }
  .shake { animation: shake .35s; }
  @keyframes shake { 20%, 60% { transform: translateX(-10px); } 40%, 80% { transform: translateX(10px); } }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pad button {
    height: 74px; border: var(--border-w) solid var(--jb-rule); border-radius: var(--radius-md); background: var(--jb-paper);
    font-family: var(--font-body); font-size: 30px; font-weight: 600; color: var(--jb-ink);
    display: flex; align-items: center; justify-content: center; transition: background-color .12s var(--ease);
  }
  .pad button:active { background: var(--jb-green-100); border-color: var(--jb-green-300); transform: translateY(1px); }
  .pad .fn { font-size: 13px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--jb-gray-600); background: #fff; }
  .pad .fn .ico { font-size: 28px; }

  .msg { min-height: 22px; margin-top: 14px; color: var(--jb-danger); font-weight: 600; font-size: 15px; }

  .title { font-size: clamp(38px, 8vw, 56px); line-height: 1.05; color: var(--jb-brown); margin: 6px 0 0; }
  .sub { font-size: 24px; line-height: 1.25; color: #8a7448; margin: 4px 0 4px; }
  .sub-es { font-size: 15px; color: var(--jb-gray-600); margin: 0 0 22px; }
  .dots3 { margin: 18px 0 26px; }

  .big { width: 100%; padding: 22px 12px; font-size: 22px; letter-spacing: .16em; border-radius: var(--radius-md); flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .big .ico { font-size: 30px; }
  .big small { font-size: 12px; letter-spacing: .3em; opacity: .85; font-weight: 600; }
  .ghost-wide { width: 100%; padding: 16px; font-size: 14px; border-radius: var(--radius-md); }

  .done-mark { width: 104px; height: 104px; border-radius: 50%; background: var(--jb-green); color: #fff; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; }
  .done-mark .ico { font-size: 54px; stroke-width: 2.5; }
  .done-mark.warn { background: var(--jb-warning); }
  .done-note { margin-top: 18px; padding: 14px 16px; border-radius: var(--radius-md); background: var(--jb-green-100); color: var(--jb-green-800); font-weight: 600; font-size: 15px; line-height: 1.45; }
  .done-note.warn { background: var(--jb-warning-bg); color: #7a5410; }

  .setup-text { color: var(--jb-gray-600); font-size: 17px; line-height: 1.6; }

  .overlay { position: fixed; inset: 0; z-index: 10; background: rgba(28, 26, 20, .5); display: none; align-items: center; justify-content: center; padding: 24px; }
  .overlay.on { display: flex; animation: fade .2s var(--ease); }
  .dialog { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 30px 24px 22px; max-width: 440px; width: 100%; text-align: center; }
  .dialog .title { font-size: 42px; }
  .dialog .sub { font-size: 22px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0 12px; }
  .row .big { margin: 0; }

  .admin-link { position: fixed; left: 22px; bottom: 12px; font-size: 11px; color: var(--jb-gray-400); text-decoration: none; }
</style>
</head>
<body>
<header>
  <img src="https://files.copilotcrm.com/8544/1792625031_d219866faeeb1.png" alt="J-Brothers Landscaping LLC"
       onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
  <div class="logo-fallback">J-Brothers Landscaping</div>
</header>

<main>
  <!-- PIN entry -->
  <section class="screen on" id="s-pin">
    <div class="tagline">Shop Clock</div>
    <div class="clock serif" id="clock">--:--</div>
    <div class="label date" id="date"></div>
    <div class="card pin-card">
      <p class="prompt serif">Enter your PIN</p>
      <p class="prompt-es serif">Introduce tu PIN de 4 dígitos</p>
      <div class="pin-dots" id="dots"><div></div><div></div><div></div><div></div></div>
      <div class="pad" id="pad">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button class="fn" data-k="clear">Clear</button><button>0</button>
        <button class="fn" data-k="back" aria-label="Delete"><svg class="ico" viewBox="0 0 24 24"><path d="M10 5a2 2 0 0 0-1.344.519l-6.328 5.74a1 1 0 0 0 0 1.481l6.328 5.741A2 2 0 0 0 10 19h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="m12 9 6 6"/><path d="m18 9-6 6"/></svg></button>
      </div>
      <div class="msg" id="pin-msg"></div>
    </div>
  </section>

  <!-- Choose action -->
  <section class="screen" id="s-action">
    <div class="label">Good to see you</div>
    <h1 class="title serif" id="hello">Hi</h1>
    <p class="sub serif" id="status"></p>
    <p class="sub-es" id="status-es"></p>
    <button class="btn btn-primary big" id="btn-in">
      <svg class="ico" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="m10 17 5-5-5-5"/><path d="M15 12H3"/></svg>
      Clock In<small>Fichar entrada</small>
    </button>
    <button class="btn btn-secondary big" id="btn-out">
      <svg class="ico" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
      Clock Out<small>Fichar salida</small>
    </button>
    <button class="btn btn-ghost ghost-wide" id="btn-cancel">Cancel · Cancelar</button>
    <div class="msg" id="action-msg"></div>
  </section>

  <!-- Done -->
  <section class="screen" id="s-done">
    <div class="done-mark" id="done-icon"></div>
    <h1 class="title serif" id="done-title"></h1>
    <p class="sub serif" id="done-text"></p>
    <p class="sub-es" id="done-es"></p>
    <div class="done-note hidden" id="done-note" style="display:none"></div>
  </section>

  <!-- Device not set up -->
  <section class="screen" id="s-setup">
    <div class="label">Shop Clock</div>
    <h1 class="title serif">Not <em>set up</em> yet</h1>
    <div class="dots3"><i></i><i></i><i></i></div>
    <p class="setup-text">This device isn't set up as the shop clock.<br>An admin can set it up from the admin screen.</p>
  </section>
</main>

<div class="overlay" id="lunch">
  <div class="dialog">
    <div class="label">Before you go</div>
    <h2 class="title serif">Did you take lunch?</h2>
    <p class="sub serif">¿Tomaste almuerzo?</p>
    <div class="row">
      <button class="btn btn-primary big" id="lunch-yes">Yes<small>Sí</small></button>
      <button class="btn btn-secondary big" id="lunch-no">No<small>No</small></button>
    </div>
    <button class="btn btn-ghost ghost-wide" id="lunch-cancel">Go back · Volver</button>
  </div>
</div>

<a class="admin-link label" href="/admin.html">Admin</a>

<script>
const $ = (id) => document.getElementById(id);
const TZ = "America/New_York";
const fmtTime = (d) => new Date(d).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
const ICON_CHECK = '<svg class="ico" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
const ICON_WARN = '<svg class="ico" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>';
let device = null;
try { device = localStorage.getItem("kioskDevice"); } catch {}
let pin = "", current = null, idleTimer = null, busy = false;

function tick() {
  const now = new Date();
  const [hm, ap] = fmtTime(now).split(/\s/);
  $("clock").innerHTML = `${hm}<span class="ampm">${ap || ""}</span>`;
  $("date").textContent = now.toLocaleDateString("en-US", { timeZone: TZ, weekday: "long", month: "long", day: "numeric" });
}
tick(); setInterval(tick, 1000);

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
  clearTimeout(idleTimer);
  if (id === "s-action") idleTimer = setTimeout(reset, 25000);
  if (id === "s-done") idleTimer = setTimeout(reset, 6000);
}
function reset() {
  pin = ""; current = null; busy = false;
  drawDots(); $("pin-msg").textContent = ""; $("action-msg").textContent = "";
  $("lunch").classList.remove("on");
  show("s-pin");
}
function drawDots() {
  [...$("dots").children].forEach((d, i) => d.classList.toggle("full", i < pin.length));
}

async function api(path, body) {
  const res = await fetch(`/api/${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Device-Token": device || "" },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({ error: "Connection problem." }));
  if (data.notSetUp) { show("s-setup"); throw new Error(data.error); }
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

$("pad").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || busy) return;
  $("pin-msg").textContent = "";
  if (b.dataset.k === "clear") pin = "";
  else if (b.dataset.k === "back") pin = pin.slice(0, -1);
  else if (pin.length < 4) pin += b.textContent.trim();
  drawDots();
  if (pin.length === 4) lookup();
});

async function lookup() {
  busy = true;
  try {
    const r = await api("kiosk/lookup", { pin });
    current = r;
    $("hello").textContent = `Hi, ${r.name.split(" ")[0]}`;
    if (r.clockedIn) {
      $("status").innerHTML = `You're <em>clocked in</em> since ${fmtTime(r.since)}`;
      $("status-es").textContent = `Fichaste entrada a las ${fmtTime(r.since)}`;
    } else {
      $("status").innerHTML = `You're <em>clocked out</em> right now`;
      $("status-es").textContent = "No has fichado";
    }
    $("btn-in").style.display = r.clockedIn ? "none" : "flex";
    $("btn-out").style.display = r.clockedIn ? "flex" : "none";
    show("s-action");
  } catch (err) {
    $("pin-msg").textContent = err.message;
    $("dots").classList.add("shake");
    setTimeout(() => $("dots").classList.remove("shake"), 400);
    pin = ""; drawDots();
  } finally { busy = false; }
}

function doneNote(text, warn) {
  const n = $("done-note");
  n.style.display = text ? "block" : "none";
  n.className = "done-note" + (warn ? " warn" : "");
  n.innerHTML = text || "";
}

async function clock(action, lunch) {
  if (busy) return;
  busy = true;
  document.querySelectorAll(".big").forEach((b) => (b.disabled = true));
  $("action-msg").textContent = "";
  try {
    const r = await api("kiosk/clock", { pin, action, lunch });
    $("lunch").classList.remove("on");
    const first = r.name.split(" ")[0];
    $("done-icon").className = "done-mark"; $("done-icon").innerHTML = ICON_CHECK;
    doneNote("");
    if (action === "in") {
      $("done-title").textContent = r.already ? "Already clocked in" : `Clocked in, ${first}`;
      $("done-text").innerHTML = r.already ? "You were already on the clock" : `${fmtTime(r.at)} · Have a good day!`;
      $("done-es").textContent = r.already ? "Ya habías fichado entrada." : "Entrada fichada. ¡Que tengas buen día!";
    } else {
      $("done-title").textContent = r.already ? "Not clocked in" : `Clocked out, ${first}`;
      $("done-text").innerHTML = r.already ? "You weren't on the clock" : `${fmtTime(r.at)} · See you tomorrow!`;
      $("done-es").textContent = r.already ? "No habías fichado entrada." : "Salida fichada. ¡Hasta mañana!";
    }
    show("s-done");
  } catch (err) {
    $("lunch").classList.remove("on");
    $("action-msg").textContent = err.message;
  } finally {
    busy = false;
    document.querySelectorAll(".big").forEach((b) => (b.disabled = false));
  }
}

$("btn-in").onclick = () => clock("in", false);
$("btn-out").onclick = () => { clearTimeout(idleTimer); idleTimer = setTimeout(reset, 25000); $("lunch").classList.add("on"); };
$("lunch-yes").onclick = () => clock("out", true);
$("lunch-no").onclick = () => clock("out", false);
$("lunch-cancel").onclick = () => $("lunch").classList.remove("on");
$("btn-cancel").onclick = reset;

// Keep the screen awake on the shop tablet.
async function stayAwake() { try { await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && stayAwake());
stayAwake();

(async () => {
  if (!device) return show("s-setup");
  try { await api("kiosk/check"); } catch {}
})();
</script>
</body>
</html>
