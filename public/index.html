<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light only">
<title>J-Brothers Shop Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --green:#68801F; --green-dk:#55691A; --brown:#684500; --sage:#ADB989; --sage-lt:#DCE6B4; --paper:#F2F2F2; --panel:#F1F4E6; --text:#2B2B2B; --red:#A3361F; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { margin:0; height:100%; background:var(--paper); color:var(--text); font-family:"Instrument Sans", system-ui, sans-serif; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  header { background:var(--brown); color:#fff; padding:14px 22px; display:flex; justify-content:space-between; align-items:center; }
  header .brand { font-weight:800; letter-spacing:.04em; font-size:18px; }
  header .brand span { color:var(--sage-lt); font-weight:600; }
  header .date { font-size:15px; color:var(--sage-lt); }
  main { flex:1; display:flex; align-items:center; justify-content:center; padding:18px; }
  .screen { display:none; width:100%; max-width:440px; text-align:center; }
  .screen.on { display:block; }
  .clock { font-size:64px; font-weight:800; color:var(--brown); line-height:1; margin-bottom:6px; font-variant-numeric:tabular-nums; }
  .hint { font-size:17px; color:#555; margin-bottom:16px; }
  .hint small { display:block; color:#888; font-size:14px; }
  .dots { display:flex; gap:14px; justify-content:center; margin:6px 0 18px; }
  .dot { width:20px; height:20px; border-radius:50%; border:2px solid var(--green); }
  .dot.full { background:var(--green); }
  .shake { animation:shake .35s; }
  @keyframes shake { 20%,60%{transform:translateX(-10px)} 40%,80%{transform:translateX(10px)} }
  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .pad button { height:76px; font-size:30px; font-weight:700; border:none; border-radius:16px; background:#fff; color:var(--text); box-shadow:0 2px 0 #D6DEB8; font-family:inherit; }
  .pad button:active { background:var(--panel); transform:translateY(1px); }
  .pad .muted { font-size:17px; color:#777; }
  .msg { min-height:24px; margin-top:14px; color:var(--red); font-weight:600; }
  h1 { font-size:38px; margin:0 0 6px; color:var(--brown); }
  .status { font-size:19px; margin-bottom:26px; color:#555; }
  .status b { color:var(--green-dk); }
  .big { display:block; width:100%; padding:26px 10px; font-size:30px; font-weight:800; border:none; border-radius:18px; color:#fff; font-family:inherit; margin-bottom:12px; }
  .big small { display:block; font-size:16px; font-weight:600; opacity:.85; }
  .big.in { background:var(--green); }
  .big.out { background:var(--brown); }
  .big:disabled { opacity:.5; }
  .ghost { background:none; border:2px solid #bbb; color:#555; border-radius:14px; padding:14px; width:100%; font-size:18px; font-weight:600; font-family:inherit; }
  .check { width:96px; height:96px; border-radius:50%; background:var(--green); color:#fff; font-size:56px; line-height:96px; margin:0 auto 16px; }
  .check.warn { background:#C98A12; }
  .overlay { position:fixed; inset:0; background:rgba(43,43,43,.55); display:none; align-items:center; justify-content:center; padding:20px; }
  .overlay.on { display:flex; }
  .modal { background:#fff; border-radius:20px; padding:26px 22px; max-width:420px; width:100%; text-align:center; }
  .modal h2 { margin:0 0 4px; font-size:28px; color:var(--brown); }
  .modal p { margin:0 0 20px; color:#666; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  .row .big { margin:0; font-size:26px; padding:22px 6px; }
  .gear { position:fixed; right:12px; bottom:10px; color:#aaa; font-size:13px; text-decoration:none; }
  .setup { color:#666; font-size:18px; line-height:1.5; }
</style>
</head>
<body>
<header>
  <div class="brand">J-BROTHERS <span>Shop Clock</span></div>
  <div class="date" id="date"></div>
</header>

<main>
  <!-- PIN entry -->
  <section class="screen on" id="s-pin">
    <div class="clock" id="clock">--:--</div>
    <div class="hint">Enter your 4-digit PIN<small>Ingrese su PIN de 4 dígitos</small></div>
    <div class="dots" id="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    <div class="pad" id="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button class="muted" data-k="clear">Clear</button><button>0</button><button class="muted" data-k="back">⌫</button>
    </div>
    <div class="msg" id="pin-msg"></div>
  </section>

  <!-- Choose action -->
  <section class="screen" id="s-action">
    <h1 id="hello">Hi</h1>
    <div class="status" id="status"></div>
    <button class="big in" id="btn-in">Clock In<small>Entrada</small></button>
    <button class="big out" id="btn-out">Clock Out<small>Salida</small></button>
    <button class="ghost" id="btn-cancel">Cancel · Cancelar</button>
    <div class="msg" id="action-msg"></div>
  </section>

  <!-- Done -->
  <section class="screen" id="s-done">
    <div class="check" id="done-icon">✓</div>
    <h1 id="done-title"></h1>
    <div class="status" id="done-text"></div>
  </section>

  <!-- Device not set up -->
  <section class="screen" id="s-setup">
    <h1>Not set up</h1>
    <p class="setup">This device isn't set up as the shop clock.<br>An admin can set it up from the admin screen.</p>
  </section>
</main>

<div class="overlay" id="lunch">
  <div class="modal">
    <h2>Did you take lunch?</h2>
    <p>¿Tomó almuerzo?<br><small>Yes takes 30 minutes off today's hours.</small></p>
    <div class="row">
      <button class="big in" id="lunch-yes">Yes<small>Sí</small></button>
      <button class="big out" id="lunch-no">No<small>No</small></button>
    </div>
    <button class="ghost" id="lunch-cancel">Go back · Regresar</button>
  </div>
</div>

<a class="gear" href="/admin.html">Admin</a>

<script>
const $ = (id) => document.getElementById(id);
const TZ = "America/New_York";
const fmtTime = (d) => new Date(d).toLocaleTimeString("en-US", { timeZone: TZ, hour: "numeric", minute: "2-digit" });
let device = null;
try { device = localStorage.getItem("kioskDevice"); } catch {}
let pin = "", current = null, idleTimer = null, busy = false;

function tick() {
  const now = new Date();
  $("clock").textContent = fmtTime(now);
  $("date").textContent = now.toLocaleDateString("en-US", { timeZone: TZ, weekday: "long", month: "long", day: "numeric" });
}
tick(); setInterval(tick, 1000);

function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
  clearTimeout(idleTimer);
  if (id === "s-action") idleTimer = setTimeout(reset, 25000);
  if (id === "s-done") idleTimer = setTimeout(reset, 5000);
}
function reset() {
  pin = ""; current = null; busy = false;
  drawDots(); $("pin-msg").textContent = ""; $("action-msg").textContent = "";
  $("lunch").classList.remove("on");
  show("s-pin");
}
function drawDots() {
  [...$("dots").children].forEach((d, i) => d.classList.toggle("full", i < pin.length));
}

async function api(path, body) {
  const res = await fetch(`/api/${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Device-Token": device || "" },
    body: JSON.stringify(body || {}),
  });
  const data = await res.json().catch(() => ({ error: "Connection problem." }));
  if (data.notSetUp) { show("s-setup"); throw new Error(data.error); }
  if (!res.ok) throw new Error(data.error || "Something went wrong.");
  return data;
}

$("pad").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b || busy) return;
  $("pin-msg").textContent = "";
  if (b.dataset.k === "clear") pin = "";
  else if (b.dataset.k === "back") pin = pin.slice(0, -1);
  else if (pin.length < 4) pin += b.textContent;
  drawDots();
  if (pin.length === 4) lookup();
});

async function lookup() {
  busy = true;
  try {
    const r = await api("kiosk/lookup", { pin });
    current = r;
    $("hello").textContent = `Hi, ${r.name.split(" ")[0]}`;
    $("status").innerHTML = r.clockedIn
      ? `You're <b>clocked in</b> since ${fmtTime(r.since)}<br><small>Está registrado desde ${fmtTime(r.since)}</small>`
      : `You're <b>clocked out</b><br><small>No está registrado</small>`;
    $("btn-in").style.display = r.clockedIn ? "none" : "block";
    $("btn-out").style.display = r.clockedIn ? "block" : "none";
    show("s-action");
  } catch (err) {
    $("pin-msg").textContent = err.message;
    $("dots").classList.add("shake");
    setTimeout(() => $("dots").classList.remove("shake"), 400);
    pin = ""; drawDots();
  } finally { busy = false; }
}

async function clock(action, lunch) {
  if (busy) return;
  busy = true;
  document.querySelectorAll(".big").forEach((b) => (b.disabled = true));
  $("action-msg").textContent = "";
  try {
    const r = await api("kiosk/clock", { pin, action, lunch });
    $("lunch").classList.remove("on");
    const first = r.name.split(" ")[0];
    $("done-icon").className = "check"; $("done-icon").textContent = "✓";
    if (action === "in") {
      $("done-title").textContent = r.already ? `${first}, you're already in` : `Clocked in, ${first}`;
      $("done-text").innerHTML = r.already ? "Ya estaba registrado." : `${fmtTime(r.at)} · Have a good day! ¡Buen día!`;
    } else {
      $("done-title").textContent = r.already ? `${first}, you weren't clocked in` : `Clocked out, ${first}`;
      let t = r.already ? "No estaba registrado." : `${fmtTime(r.at)} · See you tomorrow! ¡Hasta mañana!`;
      if (r.lunch && r.lunch.ok) t += "<br>30 min lunch taken off. · 30 min de almuerzo descontados.";
      if (r.lunch && !r.lunch.ok) {
        $("done-icon").className = "check warn"; $("done-icon").textContent = "!";
        t += "<br>Lunch couldn't be taken off automatically. The office will fix it.";
      }
      $("done-text").innerHTML = t;
    }
    show("s-done");
  } catch (err) {
    $("lunch").classList.remove("on");
    $("action-msg").textContent = err.message;
  } finally {
    busy = false;
    document.querySelectorAll(".big").forEach((b) => (b.disabled = false));
  }
}

$("btn-in").onclick = () => clock("in", false);
$("btn-out").onclick = () => { clearTimeout(idleTimer); idleTimer = setTimeout(reset, 25000); $("lunch").classList.add("on"); };
$("lunch-yes").onclick = () => clock("out", true);
$("lunch-no").onclick = () => clock("out", false);
$("lunch-cancel").onclick = () => $("lunch").classList.remove("on");
$("btn-cancel").onclick = reset;

// Keep the screen awake on the shop tablet.
async function stayAwake() { try { await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && stayAwake());
stayAwake();

(async () => {
  if (!device) return show("s-setup");
  try { await api("kiosk/check"); } catch {}
})();
</script>
</body>
</html>
